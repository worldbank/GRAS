name: Continuous Integration

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run tests
        run: pytest

  quality-and-build:
    name: Quality, build, and packaged smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy src/gras
      - name: Build distributions
        run: python -m build
      - name: Install wheel in a clean environment
        run: |
          python -m venv /tmp/gras-wheel-smoke
          /tmp/gras-wheel-smoke/bin/python -m pip install dist/*.whl
          /tmp/gras-wheel-smoke/bin/gras \
            --tenders examples/synthetic/tenders.csv \
            --bids examples/synthetic/bids.csv \
            --sanctions examples/synthetic/sanctions.csv \
            --employment examples/synthetic/employment.csv \
            --out /tmp/gras-synthetic-output \
            --profile-name balanced \
            --run-timestamp 2026-01-01T00:00:00Z
          diff -ru examples/synthetic/expected /tmp/gras-synthetic-output
